<title>Kanto Yellow Tracker</title>
<style>
:root{
  --cart:#F2C230;      /* cartridge yellow */
  --cart-dk:#C99A12;
  --scr0:#E4E8C8;      /* 4-tone screen */
  --scr1:#A9BA78;
  --scr2:#56703E;
  --scr3:#1E2D1B;
  --ink:#2A2418;
  --paper:#FFFBEA;
  --done:#56703E;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--cart);color:var(--ink);overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:var(--safe-t)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--scr3);outline-offset:2px}

header{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
header h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em;margin:0;flex:1;line-height:1.1}
header h1 small{display:block;font-size:.72rem;font-weight:600;opacity:.7;letter-spacing:0}
.meter{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem;background:var(--scr3);color:var(--scr0);padding:6px 10px;border-radius:10px}

.search{margin:0 14px 8px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--paper)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--paper);border:2px solid var(--ink);border-radius:12px;max-height:50vh;overflow:auto;z-index:30;display:none}
.results.on{display:block}
.results button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-bottom:1px solid #0001}
.results button span{opacity:.6;font-size:.85em}

main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* Map screen: the one bold element */
#mapWrap{position:absolute;inset:0 10px 10px;background:var(--scr3);border-radius:14px 14px 40px 14px;padding:10px}
#map{width:100%;height:100%;background:var(--scr0);border-radius:6px;touch-action:none;display:block}
.edge{stroke:var(--scr1);stroke-width:1.6;stroke-linecap:round}
.node{cursor:pointer}
.node .shape{fill:var(--scr0);stroke:var(--scr3);stroke-width:.7}
.node.town .shape{fill:var(--scr2)}
.node.dungeon .shape{fill:var(--scr1)}
.node.complete .shape{fill:var(--scr3)}
.node.dim{opacity:.25}
.node.sel .shape{stroke-width:1.6}
.node text{font-size:3.2px;font-weight:700;fill:var(--scr3);pointer-events:none}
.node.route text{font-size:2.6px}
.chips{position:absolute;left:18px;right:18px;bottom:18px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;border:2px solid var(--scr3);background:var(--scr0);color:var(--scr3);border-radius:999px;padding:5px 10px;font-size:.8rem;font-weight:700}
.chip[aria-pressed=true]{background:var(--scr3);color:var(--scr0)}
.zoom{position:absolute;right:20px;top:20px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:2px solid var(--scr3);background:var(--scr0);font-weight:800;font-size:1.1rem}

/* Lists */
.scroll{position:absolute;inset:0;overflow:auto;padding:0 14px 20px;-webkit-overflow-scrolling:touch}
.dexbar{display:flex;gap:6px;position:sticky;top:0;background:var(--cart);padding:4px 0 8px;z-index:2}
.row{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:10px;padding:9px 11px;margin-bottom:6px;border:2px solid transparent}
.row .num{font-variant-numeric:tabular-nums;opacity:.55;width:2.4em;font-size:.85rem}
.row .name{flex:1;font-weight:700}
.row .where{display:block;font-weight:500;font-size:.78rem;opacity:.7}
.row.got{background:var(--scr1)}
.tick{width:30px;height:30px;border-radius:8px;border:2px solid var(--ink);background:var(--paper);flex:none;display:grid;place-items:center;font-weight:900}
.got .tick,.tick[aria-checked=true]{background:var(--scr3);color:var(--scr0);border-color:var(--scr3)}
.link{background:none;border:0;padding:0;text-decoration:underline;font-size:.78rem;opacity:.8;margin-right:8px}

/* Sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:var(--paper);border-radius:20px 20px 0 0;border-top:3px solid var(--ink);transform:translateY(105%);transition:transform .25s ease;z-index:40;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
.sheet header{padding:14px 16px 6px}
.sheet h2{margin:0;font-size:1.3rem;flex:1}
.sheet .close{border:2px solid var(--ink);background:none;border-radius:10px;padding:6px 12px;font-weight:700}
.sheet .body{overflow:auto;padding:0 16px 16px}
.sheet h3{font-size:.95rem;margin:14px 0 6px}
.sheet .row{background:#F3EDCF}
.sheet .row.got{background:var(--scr1)}
.empty{opacity:.6;font-size:.9rem}

/* Progress */
.stat{background:var(--paper);border-radius:12px;padding:14px;margin-bottom:10px}
.stat h3{margin:0 0 6px;font-size:1rem;display:flex;justify-content:space-between}
.bar{height:12px;background:var(--scr0);border:2px solid var(--scr3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--scr2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btns button{border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:9px 12px;font-weight:700}
.note{font-size:.85rem;line-height:1.5;max-width:65ch}

nav{display:flex;background:var(--ink);padding:6px 6px calc(6px + var(--safe-b))}
nav button{flex:1;border:0;background:none;color:var(--cart);padding:10px 4px;font-weight:800;font-size:.9rem;border-radius:10px}
nav button[aria-selected=true]{background:var(--cart);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>

const EDGES = 'pallet-r1 r1-viridian viridian-r22 r22-r23 r23-victory victory-indigo viridian-r2 r2-vforest vforest-pewter pewter-r3 r3-mtmoon mtmoon-r4 r4-cerulean cerulean-r24 r24-r25 cerulean-ccave cerulean-r9 r9-r10 r10-power r10-rtunnel rtunnel-lavender cerulean-r5 r5-saffron saffron-r6 r6-vermilion vermilion-ssanne vermilion-r11 r11-diglett r11-r12 r12-lavender lavender-tower lavender-r8 r8-saffron saffron-r7 r7-celadon celadon-r16 r16-r17 r17-r18 r18-fuchsia fuchsia-safari fuchsia-r15 r15-r14 r14-r13 r13-r12 fuchsia-r19 r19-seafoam seafoam-r20 r20-cinnabar cinnabar-r21 r21-pallet'.split(' ').map(e=>e.split('-'));

/* ============================================================
   STATE — saved on device; falls back to memory if unavailable
   ============================================================ */
const KEY='kanto-yellow-v1';
let mem=null;
const store={
  load(){try{const v=localStorage.getItem(KEY);if(v)return JSON.parse(v)}catch(e){} return mem||{caught:{},done:{}}},
  save(s){mem=s;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
};
let S=store.load(); S.caught ||= {}; S.done ||= {};
const byId=Object.fromEntries(LOCS.map(l=>[l.id,l]));
const dk=(loc,k,n)=>`${loc}|${k}|${n}`;
const save=()=>{store.save(S);refresh()};

// Where each species can be found
const WHERE={}; DEX.forEach(n=>WHERE[n]=[]);
LOCS.forEach(l=>{[...l.w,...l.s].forEach(n=>{if(WHERE[n]&&!WHERE[n].includes(l.id))WHERE[n].push(l.id)})});

/* ============================================================
   PROGRESS
   ============================================================ */
function locStatus(l){
  const pk=[...new Set([...l.w,...l.s])];
  const total=pk.length+l.i.length+l.b.length;
  const got=pk.filter(n=>S.caught[n]).length+l.i.filter(n=>S.done[dk(l.id,'i',n)]).length+l.b.filter(n=>S.done[dk(l.id,'b',n)]).length;
  return {total,got,left:{w:l.w.filter(n=>!S.caught[n]).length,s:l.s.filter(n=>!S.caught[n]).length,i:l.i.filter(n=>!S.done[dk(l.id,'i',n)]).length,b:l.b.filter(n=>!S.done[dk(l.id,'b',n)]).length}};
}
function totals(){
  const dex=DEX.filter(n=>S.caught[n]).length;
  let it=0,itT=0,bt=0,btT=0,badges=0;
  LOCS.forEach(l=>{itT+=l.i.length;btT+=l.b.length;
    l.i.forEach(n=>{if(S.done[dk(l.id,'i',n)])it++});
    l.b.forEach(n=>{if(S.done[dk(l.id,'b',n)]){bt++;if(/Badge$/.test(n))badges++}})});
  const all=(dex+it+bt)/(DEX.length+itT+btT);
  return {dex,it,itT,bt,btT,badges,all};
}

/* ============================================================
   MAP
   ============================================================ */
const svg=document.getElementById('map'), NS='http://www.w3.org/2000/svg';
let filter=null;
const SHORT={pallet:'Pallet',tower:'Tower',seafoam:'Seafoam',vforest:'Forest',ccave:'Cave',diglett:'Diglett’s',indigo:'Indigo',victory:'Victory Rd',ssanne:'S.S. Anne',power:'Power Plant',rtunnel:'Tunnel'};
const UP=new Set(['ccave','tower','power','indigo','seafoam','safari','diglett']);
const FILTERS=[['w','Wild'],['s','Special'],['i','Items'],['b','Battles']];
function drawMap(){
  svg.innerHTML='';
  const g=document.createElementNS(NS,'g');
  EDGES.forEach(([a,b])=>{const A=byId[a],B=byId[b];const ln=document.createElementNS(NS,'line');
    Object.entries({x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:'edge'}).forEach(([k,v])=>ln.setAttribute(k,v));g.appendChild(ln)});
  LOCS.forEach(l=>{
    const st=locStatus(l), n=document.createElementNS(NS,'g');
    const dim = filter && st.left[filter]===0;
    n.setAttribute('class',`node ${l.t}${st.total&&st.got===st.total?' complete':''}${dim?' dim':''}${sel===l.id?' sel':''}`);
    n.dataset.id=l.id; n.setAttribute('role','button'); n.setAttribute('aria-label',`${l.name}, ${st.got} of ${st.total} done`);
    let sh;
    if(l.t==='town'){sh=document.createElementNS(NS,'rect');Object.entries({x:l.x-4,y:l.y-3,width:8,height:6,rx:1}).forEach(([k,v])=>sh.setAttribute(k,v))}
    else if(l.t==='dungeon'){sh=document.createElementNS(NS,'polygon');sh.setAttribute('points',`${l.x},${l.y-3.6} ${l.x+3.6},${l.y} ${l.x},${l.y+3.6} ${l.x-3.6},${l.y}`)}
    else {sh=document.createElementNS(NS,'circle');Object.entries({cx:l.x,cy:l.y,r:2.3}).forEach(([k,v])=>sh.setAttribute(k,v))}
    sh.setAttribute('class','shape'); n.appendChild(sh);
    const t=document.createElementNS(NS,'text');
    const label = l.t==='route' ? l.name.replace('Route ','') : (SHORT[l.id]||l.name.replace(/ (City|Town|Island)$/,''));
    const up = UP.has(l.id);
    t.setAttribute('x', l.t==='route'? l.x+3 : l.x); t.setAttribute('y', l.t==='route'? l.y+1 : up? l.y-4.8 : l.y+7);
    t.setAttribute('text-anchor', l.t==='route'?'start':'middle'); t.textContent=label;
    n.appendChild(t); g.appendChild(n);
  });
  svg.appendChild(g);
}
// Pan & pinch zoom on the SVG viewBox
const VB0={x:-10,y:4,w:140,h:136}; let vb={...VB0};
const setVB=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function zoomAt(f,cx,cy){const nw=Math.min(VB0.w*1.5,Math.max(20,vb.w*f));const k=nw/vb.w;
  vb.x=cx-(cx-vb.x)*k; vb.y=cy-(cy-vb.y)*k; vb.w=nw; vb.h=vb.h*k; setVB()}
function toSvg(px,py){const r=svg.getBoundingClientRect();const s=Math.max(vb.w/r.width,vb.h/r.height);
  const ox=(r.width-vb.w/s)/2, oy=(r.height-vb.h/s)/2;return {x:vb.x+(px-r.left-ox)*s,y:vb.y+(py-r.top-oy)*s,s}}
const ptrs=new Map(); let moved=0, lastD=0;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;if(ptrs.size===2){const[a,b]=[...ptrs.values()];lastD=Math.hypot(a.x-b.x,a.y-b.y)}});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return; const p=ptrs.get(e.pointerId);
  const dx=e.clientX-p.x, dy=e.clientY-p.y; moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===1){const {s}=toSvg(0,0);vb.x-=dx*s;vb.y-=dy*s;setVB()}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(lastD){const c=toSvg((a.x+b.x)/2,(a.y+b.y)/2);zoomAt(lastD/d,c.x,c.y)} lastD=d}
});
const up=e=>{
  if(ptrs.size===1&&moved<8){const n=e.target.closest&&e.target.closest('[data-id]');if(n)openLoc(n.dataset.id)}
  ptrs.delete(e.pointerId); if(ptrs.size<2)lastD=0};
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);lastD=0});
svg.addEventListener('wheel',e=>{e.preventDefault();const c=toSvg(e.clientX,e.clientY);zoomAt(e.deltaY>0?1.12:0.89,c.x,c.y)},{passive:false});
svg.addEventListener('keydown',e=>{if(e.key==='Enter'){const n=e.target.closest('[data-id]');if(n)openLoc(n.dataset.id)}});
document.getElementById('zin').onclick=()=>zoomAt(.75,vb.x+vb.w/2,vb.y+vb.h/2);
document.getElementById('zout').onclick=()=>zoomAt(1.33,vb.x+vb.w/2,vb.y+vb.h/2);
document.getElementById('zreset').onclick=()=>{vb={...VB0};setVB()};
function focusLoc(id){const l=byId[id];vb.w=50;vb.h=55;vb.x=l.x-25;vb.y=l.y-27;setVB()}

const chips=document.getElementById('chips');
FILTERS.forEach(([k,label])=>{const b=document.createElement('button');b.className='chip';b.textContent=label;b.setAttribute('aria-label',`Show places with ${label.toLowerCase()} left`);b.setAttribute('aria-pressed','false');
  b.onclick=()=>{filter=filter===k?null:k;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b&&filter===k)));drawMap()};chips.appendChild(b)});

/* ============================================================
   LOCATION SHEET
   ============================================================ */
let sel=null;
const sheet=document.getElementById('sheet'), sBody=document.getElementById('sheetBody');
function tickRow(label,checked,onToggle,extra=''){
  const r=document.createElement('div');r.className='row'+(checked?' got':'');
  r.innerHTML=`<button class="tick" role="checkbox" aria-checked="${checked}" aria-label="${label}">${checked?'✓':''}</button><span class="name">${label}${extra}</span>`;
  r.querySelector('.tick').onclick=onToggle; return r;
}
function openLoc(id){
  sel=id; const l=byId[id]; document.getElementById('sheetTitle').textContent=l.name; sBody.innerHTML='';
  const sec=(title,arr,build)=>{const h=document.createElement('h3');h.textContent=title;sBody.appendChild(h);
    if(!arr.length){const p=document.createElement('p');p.className='empty';p.textContent='None here.';sBody.appendChild(p);return}
    arr.forEach(n=>sBody.appendChild(build(n)))};
  const mon=n=>tickRow(n,!!S.caught[n],()=>{S.caught[n]=!S.caught[n];save();openLoc(id)});
  sec('Wild Pokémon',l.w,mon);
  if(l.s.length)sec('Gift, static and prize Pokémon',l.s,mon);
  sec('Items, TMs and key items',l.i,n=>{const k=dk(id,'i',n);return tickRow(n,!!S.done[k],()=>{S.done[k]=!S.done[k];save();openLoc(id)})});
  if(l.b.length)sec('Badges and key battles',l.b,n=>{const k=dk(id,'b',n);return tickRow(n,!!S.done[k],()=>{S.done[k]=!S.done[k];save();openLoc(id)})});
  sheet.classList.add('on'); drawMap();
}
function closeSheet(){sheet.classList.remove('on');sel=null;drawMap()}
document.getElementById('sheetClose').onclick=closeSheet;

/* ============================================================
   POKÉDEX
   ============================================================ */
let dexFilter='all';
function drawDex(){
  const el=document.getElementById('dexList'); el.innerHTML='';
  const bar=document.createElement('div');bar.className='dexbar';
  [['all','All'],['need','Still needed'],['got','Caught']].forEach(([k,t])=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',String(dexFilter===k));b.onclick=()=>{dexFilter=k;drawDex()};bar.appendChild(b)});
  el.appendChild(bar);
  DEX.forEach((n,i)=>{
    const got=!!S.caught[n]; if(dexFilter==='need'&&got||dexFilter==='got'&&!got)return;
    const r=document.createElement('div');r.className='row'+(got?' got':'');r.id='dex-'+i;
    const w=WHERE[n];
    r.innerHTML=`<span class="num">${String(i+1).padStart(3,'0')}</span><span class="name">${n}<span class="where"></span></span><button class="tick" role="checkbox" aria-checked="${got}" aria-label="Caught ${n}">${got?'✓':''}</button>`;
    const wh=r.querySelector('.where');
    if(w.length) w.forEach(id=>{const a=document.createElement('button');a.className='link';a.textContent=byId[id].name;a.onclick=()=>{tab('map');focusLoc(id);openLoc(id)};wh.appendChild(a)});
    else wh.textContent='Evolve or trade';
    r.querySelector('.tick').onclick=()=>{S.caught[n]=!got;save();drawDex()};
    el.appendChild(r);
  });
}

/* ============================================================
   PROGRESS VIEW
   ============================================================ */
function drawProg(){
  const t=totals(), el=document.getElementById('prog');
  const stat=(title,a,b)=>`<div class="stat"><h3><span>${title}</span><span>${a} / ${b}</span></h3><div class="bar"><i style="width:${b?a/b*100:0}%"></i></div></div>`;
  el.innerHTML = stat('Pokédex',t.dex,DEX.length)+stat('Badges',t.badges,8)+stat('Items, TMs and key items',t.it,t.itT)+stat('Key battles',t.bt,t.btT)+
  `<div class="stat"><h3><span>Backup</span></h3><p class="note">Progress is saved on this device. Copy a backup code before clearing Safari data or switching phones.</p>
   <div class="btns"><button id="exp">Copy backup code</button><button id="imp">Restore from code</button><button id="rst">Reset all progress</button></div></div>
   <div class="stat"><h3><span>About the data</span></h3><p class="note">Encounter tables and item lists are a best-effort guide and may have gaps or mistakes. Everything lives in the DATA block at the top of index.html, so you can correct or extend it.</p></div>`;
  document.getElementById('exp').onclick=async()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    try{await navigator.clipboard.writeText(code);alert('Backup code copied.')}catch(e){prompt('Copy this backup code:',code)}};
  document.getElementById('imp').onclick=()=>{const c=prompt('Paste a backup code:');if(!c)return;
    try{const v=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));if(!v.caught||!v.done)throw 0;S=v;save();alert('Progress restored.')}catch(e){alert('That code could not be read. Check it was copied in full.')}};
  document.getElementById('rst').onclick=()=>{if(confirm('Clear every checkmark? This cannot be undone.')){S={caught:{},done:{}};save()}};
}

/* ============================================================
   SEARCH
   ============================================================ */
const q=document.getElementById('q'), res=document.getElementById('results');
q.addEventListener('input',()=>{
  const s=q.value.trim().toLowerCase(); res.innerHTML='';
  if(s.length<2){res.classList.remove('on');return}
  const out=[];
  LOCS.forEach(l=>{if(l.name.toLowerCase().includes(s))out.push([l.name,'Place',()=>go(l.id)]);
    l.i.forEach(n=>{if(n.toLowerCase().includes(s))out.push([n,l.name,()=>go(l.id)])});
    l.b.forEach(n=>{if(n.toLowerCase().includes(s))out.push([n,l.name,()=>go(l.id)])})});
  DEX.forEach((n,i)=>{if(n.toLowerCase().includes(s))out.push([n,WHERE[n].length?WHERE[n].map(id=>byId[id].name).join(', '):'Evolve or trade',()=>{dexFilter='all';tab('dex');drawDex();document.getElementById('dex-'+i)?.scrollIntoView({block:'center'})}])});
  out.slice(0,30).forEach(([a,b,f])=>{const bt=document.createElement('button');bt.innerHTML=`${a} <span>${b}</span>`;bt.onclick=()=>{res.classList.remove('on');q.value='';q.blur();f()};res.appendChild(bt)});
  if(!out.length)res.innerHTML='<button disabled>No matches. Try a shorter name.</button>';
  res.classList.add('on');
});
function go(id){tab('map');focusLoc(id);openLoc(id)}

/* ============================================================
   TABS + REFRESH
   ============================================================ */
function tab(v){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  if(v!=='map')closeSheet(); if(v==='dex')drawDex(); if(v==='prog')drawProg()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.v));
function refresh(){document.getElementById('meter').textContent=Math.round(totals().all*100)+'%';drawMap();
  if(document.getElementById('v-prog').classList.contains('on'))drawProg()}
refresh();

/* Offline support (needs HTTPS or localhost) */
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
